name: offline-research
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest
      - run: uv run pm-engine demo
      - run: uv run pm-engine replay --recording fixtures/replay.json --seed 42
