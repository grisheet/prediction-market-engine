[project]
name = "prediction-market-engine"
version = "0.1.0"
description = "Offline-first binary market research and deterministic paper execution"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.121.1", "pydantic==2.12.4", "pydantic-settings==2.12.0", "httpx==0.28.1", "websockets==15.0.1", "sqlalchemy==2.0.44", "alembic==1.17.2", "pyyaml==6.0.3", "uvicorn==0.38.0", "streamlit==1.51.0"]
[dependency-groups]
dev = ["pytest==9.0.1", "pytest-asyncio==1.3.0", "hypothesis==6.148.1", "ruff==0.14.5", "mypy==1.18.2", "types-PyYAML==6.0.12.20250915"]
[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["app"]
[tool.hatch.build.targets.sdist]
include = ["app", "config", "fixtures", "tests", "docs", ".github", ".devcontainer", "scripts", ".env.example", ".gitignore", ".dockerignore", "pyproject.toml", "uv.lock", "alembic.ini", "Dockerfile", "compose.yaml", "README.md", "web", "index.html", "terms.html", "privacy.html", "package.json", "package-lock.json", ".nojekyll"]
[project.scripts]
pm-engine = "app.cli:main"
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.mypy]
python_version = "3.12"
strict = true
